name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  TURBO_CACHE_DIR: .turbo/cache

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.3

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm

      - uses: actions/cache@v5
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-lint-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-lint-${{ github.ref_name }}-
            turbo-${{ runner.os }}-lint-
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.3

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm

      - uses: actions/cache@v5
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-build-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-build-${{ github.ref_name }}-
            turbo-${{ runner.os }}-build-
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.3

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm

      - uses: actions/cache@v5
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-test-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-test-${{ github.ref_name }}-
            turbo-${{ runner.os }}-test-
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Couverture sur chaque push et PR : les seuils des vitest.config.ts
      # (≥ 90 % pour le widget) font échouer le job.
      - name: Test
        run: pnpm test:coverage

  sonarqube:
    name: SonarQube
    needs: [build, test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.3

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm

      - uses: actions/cache@v5
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-sonar-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-sonar-${{ github.ref_name }}-
            turbo-${{ runner.os }}-sonar-
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate coverage
        run: pnpm test:coverage

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

      - name: SonarQube quality gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
