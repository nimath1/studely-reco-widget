name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  TURBO_CACHE_DIR: .turbo/cache

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.3

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm

      - uses: actions/cache@v5
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-lint-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-lint-${{ github.ref_name }}-
            turbo-${{ runner.os }}-lint-
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.3

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm

      - uses: actions/cache@v5
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-build-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-build-${{ github.ref_name }}-
            turbo-${{ runner.os }}-build-
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Le build du widget exige l'URL de l'API (fixée au build, §7.4). La CI
      # vérifie le bundle, elle ne le déploie pas : l'URL de dev suffit tant
      # que la variable de dépôt RECO_API_URL n'est pas définie.
      - name: Build
        run: pnpm build
        env:
          VITE_RECO_API_URL: ${{ vars.RECO_API_URL || 'https://chatbot.dev.ml.studely.com' }}

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.3

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm

      - uses: actions/cache@v5
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-test-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-test-${{ github.ref_name }}-
            turbo-${{ runner.os }}-test-
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Couverture sur chaque push et PR : les seuils des vitest.config.ts
      # (≥ 90 % pour le widget) font échouer le job.
      - name: Test
        run: pnpm test:coverage

  e2e:
    name: E2E (widget, mock MSW)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.3

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright chromium
        run: pnpm --filter @studely/widget exec playwright install --with-deps chromium

      # Parcours réels contre la page de dev + mock MSW (§12.1 phase 1) ;
      # axe-core vérifie l'absence de violation sérieuse sur chaque état.
      - name: E2E
        run: pnpm --filter @studely/widget test:e2e

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-results
          path: packages/widget/test-results
          retention-days: 7

  sonarqube:
    name: SonarQube
    needs: [build, test, e2e]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.3

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm

      - uses: actions/cache@v5
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-sonar-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-sonar-${{ github.ref_name }}-
            turbo-${{ runner.os }}-sonar-
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate coverage
        run: pnpm test:coverage

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

      - name: SonarQube quality gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
