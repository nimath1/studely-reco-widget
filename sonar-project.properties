sonar.projectKey=eagle
sonar.projectName=eagle
sonar.organization=learnup

sonar.sources=apps,packages
sonar.inclusions=**/*.js,**/*.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/.turbo/**,**/*.spec.js,**/*.spec.ts,**/*.test.js,**/*.test.ts,**/eslint.config.js,**/vitest.config.ts,**/vitest.setup.ts,**/i18n/**,**/mocks/**,**/plugins/**,**/tests/**,**/test/**,**/*-spec.js,**/*-spec.ts,**/*.stories.js,**/*.stories.ts,apps/api/prisma/generated/**

sonar.projectBaseDir=.
sonar.sourceEncoding=UTF-8

# Le quality gate est contrôlé par l'action GitHub dédiée après le scan.
sonar.javascript.lcov.reportPaths=apps/api/coverage/lcov.info,apps/widget/coverage/lcov.info

# Fichiers purement déclaratifs exclus de la métrique de couverture —
# aligné sur l'exclude de coverage d'apps/api/vitest.config.ts.
sonar.coverage.exclusions=apps/api/src/main.ts,apps/api/src/**/*.module.ts,apps/api/src/**/*.dto.ts,apps/api/src/**/*.guard.ts,apps/api/src/**/*.decorator.ts,apps/api/src/generated/**
